<svg xmlns="http://www.w3.org/2000/svg" width="996" height="250" viewBox="0 0 996 250" role="img" aria-label="Thanks for stopping by! Come say hi, or swap ideas with me anytime."><title>Thanks for stopping by! Come say hi, or swap ideas with me anytime.</title><style>@font-face{font-family:'M6';src:url(data:font/woff;base64,) format('woff')}.M6{font-family:'M6',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F7';src:url(data:font/woff;base64,) format('woff')}.F7{font-family:'F7',ui-rounded,system-ui,sans-serif}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.d1{animation-delay:-.8s}.d2{animation-delay:-1.6s}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.5) rotate(45deg)}}
.flt{animation:flt 3s ease-in-out infinite}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}40%{transform:scale(.95)}60%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tail{animation:tail 1.8s ease-in-out infinite}@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.wave{animation:wave 1.6s ease-in-out infinite}@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(10deg)}}
.zz{animation:zz 3s ease-out infinite;opacity:0}@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(18px,-38px);opacity:0}}
.rise2{animation:r2 3s ease-in-out infinite}@keyframes r2{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}</style>
