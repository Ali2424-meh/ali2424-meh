<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-label="TidyDen: Book trusted local home cleaners across Australia, with live availability and easy booking."><title>TidyDen: Book trusted local home cleaners across Australia, with live availability and easy booking.</title><style>@font-face{font-family:'M6';src:url(data:font/woff;base64,) format('woff')}.M6{font-family:'M6',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F7';src:url(data:font/woff;base64,) format('woff')}.F7{font-family:'F7',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F5';src:url(data:font/woff;base64,) format('woff')}.F5{font-family:'F5',ui-rounded,system-ui,sans-serif}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.d1{animation-delay:-.8s}.d2{animation-delay:-1.6s}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.5) rotate(45deg)}}
.flt{animation:flt 3s ease-in-out infinite}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}40%{transform:scale(.95)}60%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.orbit{animation:orb 6s linear infinite;transform-box:view-box;transform-origin:0 0}@keyframes orb{to{transform:rotate(360deg)}}
.counter{animation:orb 6s linear infinite reverse}
.spray{animation:spr 2.4s ease-in-out infinite}@keyframes spr{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.bub{animation:bub 2.8s ease-out infinite}@keyframes bub{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(10px,-34px) scale(1.2);opacity:0}}
.broom{animation:brm 1.4s ease-in-out infinite}@keyframes brm{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-14deg)}}
.wave2{animation:wv2 2s ease-in-out infinite}@keyframes wv2{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.lmw{animation:pu 1s ease-in-out infinite}
.bubble{transform-box:fill-box;transform-origin:0% 100%;animation:bb 2s ease-in-out infinite}@keyframes bb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.win{animation:flt 3s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{transform:scale(.6);opacity:.5}}
