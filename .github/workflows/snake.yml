name: Generate contribution caterpillar

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github&color_snake=#FF7EB0&color_dots=#FFF1F7,#FFD3E4,#FFB5CF,#F28DB8,#D9649A
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFB5CF&color_dots=#2A1F33,#4A3358,#7A5194,#B48DE0,#E4CCFF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
